<style>
/* Layout: full-bleed 3D campus; thin ink-on-paper overlays pinned to corners, like a printed campus guide map. */
:root{
  --paper:#f6efe2; --paper-2:#ece2cf; --ink:#2b2420; --ink-soft:#6b5d52;
  --brick:#a8432f; --brick-deep:#7e2f20; --leaf:#4f7a4a; --gold:#c99a3b;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#cfe0e6;color:var(--ink);font-family:var(--body)}
#scene{position:fixed;inset:0;touch-action:none}
#warm{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(255,236,205,0) 55%,rgba(120,72,30,.22) 100%);mix-blend-mode:multiply}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 16px;font-weight:700;font-size:14px;transition:opacity .4s}
#toast.off{opacity:0}
#clock{font-variant-numeric:tabular-nums;color:var(--brick-deep);font-weight:700}
canvas{display:block}
[hidden]{display:none!important}
.panel{background:var(--paper);border:1.5px solid var(--ink);box-shadow:3px 3px 0 rgba(43,36,32,.85)}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#brand{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));padding:10px 14px 9px;max-width:min(300px,calc(100vw - 230px))}
#brand .k{font-size:10px;letter-spacing:.18em;color:var(--brick);font-weight:700;text-transform:uppercase}
#brand h1{font-family:var(--display);font-weight:900;font-size:22px;margin:2px 0 4px;line-height:1.15}
#brand .meta{font-size:12px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
#brand .meta b{color:var(--brick-deep)}

#side{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#mini{width:190px;height:158px;padding:0;display:block}
#mini canvas{width:100%;height:100%}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 24px)}
.tools button{background:var(--paper);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:6px 10px;font-size:13px;font-weight:500;color:var(--ink)}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

#list{position:fixed;top:calc(238px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:240px;max-height:calc(100% - 260px);overflow:auto;padding:10px 0}
#list h2{font-family:var(--display);font-size:15px;margin:0 14px 6px}
#list .tabs{display:flex;gap:6px;margin:0 14px 8px}
#list .tabs button{flex:1;background:var(--paper);border:1.5px solid var(--ink);padding:4px 8px;font-size:13px;color:var(--ink)}
#list .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#card .dir{margin-top:10px;padding-top:8px;border-top:1.5px solid var(--ink);font-size:13px;line-height:1.5}
#card .dir b{display:block;font-size:11px;letter-spacing:.12em;color:var(--brick);margin-bottom:4px}
#card .dir .row{display:grid;grid-template-columns:40px 1fr;gap:6px;padding:2px 0}
#card .dir .row i{font-family:Georgia,serif;color:var(--ink-soft);font-size:12px}
#card .dir .row.hi{background:#f3dcc4;font-weight:700}
#card .dir .fl{font-variant-numeric:tabular-nums;color:var(--ink-soft)}
#list ol{list-style:none;margin:0;padding:0}
#list li button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:7px 14px;font-size:14px;cursor:pointer}
#list li button:hover,#list li button:focus-visible{background:var(--paper-2)}
#list .no{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#list .tag{font-size:11px;padding:1px 6px;border:1px solid var(--ink-soft);color:var(--ink-soft)}
#list .done .tag{background:var(--brick);border-color:var(--brick);color:var(--paper)}

#card{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100vw - 32px));padding:14px 18px 14px;display:grid;grid-template-columns:auto 1fr;gap:14px;transition:opacity .25s, transform .25s}
#card.off{opacity:0;transform:translate(-50%,12px);pointer-events:none}
#card .stamp{width:58px;height:58px;border:2px solid var(--brick);border-radius:50%;display:grid;place-items:center;color:var(--brick);font-family:var(--display);font-weight:900;font-size:13px;text-align:center;line-height:1.1;transform:rotate(-8deg)}
#card .kind{font-size:11px;letter-spacing:.14em;color:var(--brick);font-weight:700}
#card h3{font-family:var(--display);font-size:21px;margin:2px 0 6px;text-wrap:balance}
#card p{margin:0;font-size:14px;line-height:1.7;color:var(--ink)}
#card .fact{margin-top:6px;font-size:12px;color:var(--ink-soft)}
#card{max-height:min(46vh,420px);overflow:auto}
#card p.en{margin-top:8px;padding-top:8px;border-top:1px dashed var(--ink-soft);font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.6;color:var(--ink)}
#card .fact.en{font-family:Georgia,"Times New Roman",serif;font-style:italic}
#card h3 .en{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:15px;color:var(--brick);margin-left:6px}
#list small.en{display:block;font-size:11px;color:var(--ink-soft);font-family:Georgia,serif}
.note a{color:var(--ink-soft)}

#joy{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:2px solid rgba(43,36,32,.6);background:rgba(246,239,226,.45);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}

#intro{position:fixed;inset:0;display:grid;place-items:center;background:rgba(43,36,32,.35);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#intro .panel{max-width:460px;padding:24px 26px 22px}
#intro .k{font-size:11px;letter-spacing:.2em;color:var(--brick);font-weight:700}
#intro h2{font-family:var(--display);font-weight:900;font-size:30px;margin:4px 0 10px;line-height:1.2}
#intro p{font-size:14px;line-height:1.75;margin:0 0 10px}
#intro ul{margin:0 0 16px;padding-left:18px;font-size:13px;line-height:1.8;color:var(--ink-soft)}
#intro kbd{font-family:var(--body);border:1px solid var(--ink-soft);padding:0 5px;font-size:12px;background:var(--paper-2)}
#go{background:var(--brick);color:var(--paper);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:16px;font-weight:700;padding:10px 22px}
#go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.note{font-size:12px;color:var(--ink-soft)}

#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:var(--paper)}

@media (max-width:640px){
  #brand{max-width:calc(100vw - 150px)}
  #brand h1{font-size:18px}
  #mini{width:120px;height:100px}
  #list{top:calc(150px + env(safe-area-inset-top,0px));width:min(240px,calc(100vw - 32px));max-height:calc(100% - 330px)}
  #card{bottom:calc(150px + env(safe-area-inset-bottom,0px));grid-template-columns:1fr}
  #card .stamp{display:none}
  .tools button{padding:5px 8px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){#card{transition:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const T = THREE;
const $ = id => document.getElementById(id);

/* ---------- plan coordinates: pixels on the official campus plan → meters ---------- */
const S = 0.5;
const X = px => (px-430)*S;
const Z = py => (py-340)*S;
const R = (x1,y1,x2,y2) => ({x:X((x1+x2)/2), z:Z((y1+y2)/2), w:(x2-x1)*S, d:(y2-y1)*S});

/* ---------- renderer / scene ---------- */
const host = $('scene');
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
renderer.physicallyCorrectLights = false;
host.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0xeed8bf).convertSRGBToLinear();
scene.fog = new T.Fog(new T.Color(0xe6c9a8).convertSRGBToLinear(), 230, 620);
const camera = new T.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 1000);

const hemi = new T.HemisphereLight(new T.Color(0xfff0dc).convertSRGBToLinear(), new T.Color(0x6e5f48).convertSRGBToLinear(), 0.6); scene.add(hemi);
const fill = new T.DirectionalLight(new T.Color(0xbcd2ec).convertSRGBToLinear(), 0.18); fill.position.set(120,80,-140); scene.add(fill);
const sun = new T.DirectionalLight(new T.Color(0xffcf96).convertSRGBToLinear(), 1.65);
// 天空：上方淡藍、地平線暖橘的漸層天球
const skyDome = new T.Mesh(new T.SphereGeometry(900,32,16), new T.ShaderMaterial({ side:T.BackSide, depthWrite:false, fog:false,
  uniforms:{ top:{value:new T.Color(0x5f97d0).convertSRGBToLinear()}, mid:{value:new T.Color(0xa9c9e2).convertSRGBToLinear()}, bot:{value:new T.Color(0xeec39a).convertSRGBToLinear()} },
  vertexShader:'varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP; void main(){ float h=vP.y; vec3 c = h>0.18 ? mix(mid,top,smoothstep(0.18,0.8,h)) : mix(bot,mid,smoothstep(-0.05,0.18,h)); gl_FragColor=vec4(c,1.0); }' }));
skyDome.userData.keepColor = true; scene.add(skyDome);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera; sc.left=-150; sc.right=150; sc.top=150; sc.bottom=-150; sc.near=10; sc.far=460;
sun.shadow.bias = -0.0008;
scene.add(sun); scene.add(sun.target);

const mat = (c, o={}) => new T.MeshStandardMaterial(Object.assign({color:c, roughness:0.92, metalness:0}, o));
const colliders = [];
const occluders = [];
const footprints = [];
function addCollider(x,z,w,d){ colliders.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2}); }
function shadowy(m){ m.castShadow = true; m.receiveShadow = true; return m; }
function plane(w,d,color,x,z,y){
  const m = new T.Mesh(new T.PlaneGeometry(w,d), mat(color));
  m.rotation.x = -Math.PI/2; m.position.set(x,y,z); m.receiveShadow = true; scene.add(m); return m;
}
function planePx(x1,y1,x2,y2,color,y){ const r=R(x1,y1,x2,y2); return plane(r.w,r.d,color,r.x,r.z,y); }
const SUNK = {x1:582,y1:455,x2:670,y2:515,depth:3.6};   // 弘道樓右天井：B1 下沉平台（平面圖像素）
function sunkHole(){ const p=new T.Path(); const a=[[SUNK.x1,SUNK.y1],[SUNK.x1,SUNK.y2],[SUNK.x2,SUNK.y2],[SUNK.x2,SUNK.y1]]; a.forEach((q,i)=>{ const v=[X(q[0]),-Z(q[1])]; i?p.lineTo(v[0],v[1]):p.moveTo(v[0],v[1]); }); p.closePath(); return p; }
function polyMesh(pxPts,color,y,hole){
  const sh = new T.Shape(pxPts.map(p=>new T.Vector2(X(p[0]),-Z(p[1]))));
  if(hole) sh.holes.push(sunkHole());
  const g = new T.ShapeGeometry(sh); g.rotateX(-Math.PI/2);
  const m = new T.Mesh(g, mat(color)); m.position.y = y; m.receiveShadow = true; scene.add(m); return m;
}

/* ---------- campus outline (from the plan) ---------- */
const CAMPUS_PX = [[185,48],[632,42],[728,60],[728,592],[698,622],[200,622],[116,412],[90,335],[42,298]];
const CAMPUS = CAMPUS_PX.map(p=>[X(p[0]),Z(p[1])]);
function inPoly(x,z){
  let c=false;
  for(let i=0,j=CAMPUS.length-1;i<CAMPUS.length;j=i++){
    const [xi,zi]=CAMPUS[i],[xj,zj]=CAMPUS[j];
    if(((zi>z)!==(zj>z)) && (x < (xj-xi)*(z-zi)/(zj-zi)+xi)) c=!c;
  }
  return c;
}

/* ---------- surroundings ---------- */
(function(){ const sh=new T.Shape([new T.Vector2(-700,-700),new T.Vector2(700,-700),new T.Vector2(700,700),new T.Vector2(-700,700)]); sh.holes.push(sunkHole());
  const g=new T.ShapeGeometry(sh); g.rotateX(-Math.PI/2); const m=new T.Mesh(g,mat(0x9aa59a)); m.position.y=-0.06; m.receiveShadow=true; scene.add(m); })();   // city ground
planePx(-400,628,1300,690,0x55524f,0.01);                     // 公園北路
for(let px=-380; px<1300; px+=24) planePx(px,657,px+12,659,0xf3ecd8,0.03);
planePx(738,-300,790,628,0x55524f,0.01);                      // 北門路二段
for(let py=-280; py<620; py+=24) planePx(763,py,765,py+12,0xf3ecd8,0.03);
planePx(728,-300,738,628,0xc5bcad,0.02);                      // 人行道（校門側）
planePx(790,-300,794,628,0xc5bcad,0.02);                      // 人行道（對面）
planePx(794,-400,818,900,0x8d8478,0.015);                     // 舊鐵道道碴（北門路對面）
planePx(-400,622,1300,628,0xc5bcad,0.02);
planePx(-400,690,1300,1300,0x7f9f66,0.0);                     // 臺南公園
// city blocks across 北門路
[[822,40,882,110,10],[892,40,982,120,16],[822,130,872,220,8],[882,140,962,215,12],[827,240,902,320,14],[912,235,982,330,9],[822,345,877,430,11],[892,350,982,440,18],[822,455,902,540,10],[912,460,982,545,13],[822,560,892,615,8],[907,560,982,615,12],
 [0,-80,120,30,9],[-120,-40,0,60,12],
 [190,0,232,36,9],[240,4,280,34,12],[288,-2,330,32,7],[338,2,382,32,10],[390,-6,436,30,8],[444,0,488,28,13],[496,-4,540,24,9],[548,-8,600,22,11],[608,-12,650,18,8]].forEach(b=>{
  const r=R(b[0],b[1],b[2],b[3]);
  const m=shadowy(new T.Mesh(new T.BoxGeometry(r.w,b[4],r.d),mat(0xd2cbc0)));
  m.position.set(r.x,b[4]/2,r.z); scene.add(m);
});

/* ---------- campus ground ---------- */
polyMesh(CAMPUS_PX,0xdcd6ca,0.0,true);                                         // paving
polyMesh([[185,48],[178,70],[168,282],[70,282],[42,298]],0x7fa36a,0.02);  // 西北綠帶
planePx(186,44,632,64,0x7fa36a,0.02);                                     // 北側綠帶
planePx(192,47,470,60,0xb4a69a,0.025);                                    // 圍牆內側紅磚步道
polyMesh([[452,392],[728,392],[728,592],[714,606],[452,606]],0x7fa36a,0.02,true);
polyMesh([[728,592],[738,592],[738,628],[698,628],[698,622]],0xc5bcad,0.022);   // 東南角斜切外的人行道                                   // 行政大樓四周綠地
planePx(286,386,406,430,0x6f9a5c,0.03);                                   // 勤學樓北側綠地
planePx(168,178,268,284,0x7fa36a,0.02);                                   // 泳池周圍
planePx(515,560,642,618,0xd9d1c2,0.035);                                  // 紅樓前廣場
planePx(398,392,464,622,0x7a7772,0.032);                                  // 大門車道（柏油）
for(let py=600;py>400;py-=26) planePx(426,py-10,428,py,0xf3ecd8,0.036);

/* ---------- textures ---------- */
const texCache = {};
function facade(wall, glass, band){
  const key = wall+'|'+glass+'|'+band;
  if(texCache[key]) return texCache[key];
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = wall; g.fillRect(0,0,64,64);
  g.fillStyle = band; g.fillRect(0,56,64,8);
  g.fillStyle = glass; g.fillRect(9,16,46,30);
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(9,16,46,4);
  g.fillStyle = band; g.fillRect(31,16,2,30);
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping;
  texCache[key] = t; return t;
}
function facadeMat(spec, len, floors){
  const t = (spec.draw ? canvasTex(spec.key,64,64,spec.draw) : facade(spec.wall, spec.glass, spec.band)).clone();
  t.needsUpdate = true; t.repeat.set(Math.max(1,Math.round(len/5)), floors);
  return new T.MeshStandardMaterial({map:t, roughness:0.95});
}
function brickCanvas(g,w,h,base,mortar,course,len){
  g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let y=0,r=0;y<h;y+=course,r++){
    for(let x=-(r%2)*len/2;x<w;x+=len){ g.fillStyle=`rgba(${(x*7+y*3)%2?'255,255,255':'0,0,0'},${0.03+((x+y)%5)*0.012})`; g.fillRect(x+1,y+1,len-2,course-2); }
    g.fillStyle=mortar; g.fillRect(0,y,w,1);
    for(let x=-(r%2)*len/2;x<w;x+=len) g.fillRect(x,y,1,course);

const STONE_BRICK = (g,w,h)=>{ brickCanvas(g,w,h,'#b24f38','#cdbcaa',8,22); g.fillStyle='#d6d0c3'; g.fillRect(0,0,w,14); g.fillStyle='rgba(0,0,0,.10)'; g.fillRect(0,14,w,2); };
function sbMat(rx,ry){ return texMat('stonebrick',rx,ry,128,128,STONE_BRICK); }
const stoneM = mat(0xd6d0c3);
function triPlane(width,rise,material){
  const sh=new T.Shape(); sh.moveTo(-width/2,0); sh.lineTo(width/2,0); sh.lineTo(0,rise); sh.lineTo(-width/2,0);
  return new T.Mesh(new T.ShapeGeometry(sh), material);
}
function archWindow(x,y,z,w,h,frameColor,rotY=0){
  const g=new T.Group();
  const fm=mat(frameColor), gm=mat(0x33424a,{roughness:0.4});
  const f=new T.Mesh(new T.PlaneGeometry(w+0.4,h+0.2),fm); f.position.set(0,0,0); g.add(f);
  const fc=new T.Mesh(new T.CircleGeometry((w+0.4)/2,20,0,Math.PI),fm); fc.position.set(0,(h+0.2)/2,0); g.add(fc);
  const gl=new T.Mesh(new T.PlaneGeometry(w,h),gm); gl.position.z=0.02; g.add(gl);
  const gc=new T.Mesh(new T.CircleGeometry(w/2,20,0,Math.PI),gm); gc.position.set(0,h/2,0.02); g.add(gc);
  g.position.set(x,y,z); g.rotation.y=rotY; scene.add(g); return g;
}
function rectWindow(x,y,z,w,h,rotY=0){
  const g=new T.Group();
  const f=new T.Mesh(new T.PlaneGeometry(w+0.5,h+0.5),stoneM); g.add(f);
  const gl=new T.Mesh(new T.PlaneGeometry(w,h),mat(0x33424a,{roughness:0.4})); gl.position.z=0.02; g.add(gl);

  g.position.set(x,y,z); g.rotation.y=rotY; scene.add(g); return g;
}

function animateStudent(s, moving, speed, t){
  const u=s.mesh.userData;
  if(moving){
    const sw=Math.sin(t*speed*2.2+u.phase)*Math.min(0.9,0.25+speed*0.09);
    u.legs[0].rotation.x=sw; u.legs[1].rotation.x=-sw;
    u.arms[0].rotation.x=-sw*0.8; u.arms[1].rotation.x=sw*0.8;
    s.mesh.position.y=Math.abs(Math.sin(t*speed*2.2+u.phase))*0.1*Math.min(2,speed/3);
  } else {
    u.legs[0].rotation.x*=0.8; u.legs[1].rotation.x*=0.8;
    u.arms[0].rotation.x=Math.sin(t*1.3+u.phase)*0.12; u.arms[1].rotation.x=-u.arms[0].rotation.x;
    s.mesh.position.y=0;
  }
}

function trackPos(s, R){
  const L=TRACK.L, P=2*L+2*Math.PI*R; s=((s%P)+P)%P;
  if(s<L) return [TRACK.cx+R, TRACK.cz-L/2+s];
  s-=L; if(s<Math.PI*R){ const a=s/R; return [TRACK.cx+R*Math.cos(a), TRACK.cz+L/2+R*Math.sin(a)]; }
  s-=Math.PI*R; if(s<L) return [TRACK.cx-R, TRACK.cz+L/2-s];
  s-=L; const a=s/R; return [TRACK.cx-R*Math.cos(a), TRACK.cz-L/2-R*Math.sin(a)];
}

const EN = {"gate": {"n": "Main Gate", "k": "Entrance", "d": "The main gate on Gongyuan North Road. On the left is a stone wall carved with the school name and a sliding gate; the tall stone pillar in the middle reads \"National Tainan Second Senior High School\" from top to bottom; on the right is the guard house, whose LED board shows school news. Walk in and head north along the tree-lined driveway.", "f": "Founded in 1914 as Tainan Middle School under the Japanese colonial government, the first middle school in central and southern Taiwan. Renamed Tainan Prefectural Tainan First Middle School in 1922, and Taiwan Provincial Tainan Second Middle School in 1945."}, "park": {"n": "Tainan Park", "k": "Off campus", "d": "Tainan Park is right across from the main gate. Behind the red-pillared, green-tiled entrance arch are old banyan trees, and further in you will find Yan Pond and its island pavilion. Many students walk through the park on their way home.", "f": ""}, "island": {"n": "Entrance Median", "k": "Entrance", "d": "A tree-lined median runs up the middle of the driveway. Palm trees stand on the left; behind the hedge on the right is the entrance hall of Hong Dao Building. Go straight to the end and the yellow-brick wall with a mosaic is Ming-De Hall.", "f": ""}, "arch": {"n": "Strive for Perfection", "k": "School motto", "d": "A small gateway against the Gongyuan North Road wall, southwest of the fountain. It runs parallel to the wall and faces the campus, so people outside cannot see the words. Two red pillars hold up green glazed-tile eaves, and the beige plaque reads the school motto, 止於至善 \"Strive for the highest good\", from right to left.", "f": "The motto comes from The Great Learning: \"The way of great learning lies in manifesting bright virtue, in renewing the people, and in resting in the highest good.\""}, "sun": {"n": "Fountain", "k": "Red House", "d": "The fountain in the round plaza in front of the Red House. A black ring sculpture with a golden band stands in the stone pool, surrounded by brick paths, lawn and big trees. The motto gateway is to the southwest and the Red House arch is to the north.", "f": "The blog notes that in 2014, for the school's 100th anniversary, an artwork called \"Rising Sun\" was placed in front of the Red House, symbolizing a phoenix taking flight and the sun slowly rising."}, "genkan": {"n": "Red House", "k": "City monument", "d": "The old Red House entrance, just north of the fountain. Two two-story red brick buildings once stood here; after decades of wear they were rebuilt into the four-story Hong Dao Building, keeping only this south entrance. It has a huge arch with clearly cut voussoirs and an oversized keystone, three square openings above, round-arched windows at the sides, a horizontal band across the front, and a heavy projecting roof that echoes the stone base. Walk through the arch and the passage leads all the way north to the sports field.", "f": "Built mainly of brick and freely borrowing Western details, it is classed as \"red brick eclectic style\". The entrance hall has two round columns and two half columns, all in the Tuscan order."}, "passage": {"n": "Red House Passage", "k": "Hong Dao", "d": "The passage inside the Red House arch. Four white Tuscan columns stand in a row on mint-green bases, with a white arch in the middle. Beyond the arch is the red brick arcade between the two courtyards. On the right wall are a blue arched door and a notice board.", "f": ""}, "hongdao": {"n": "Hong Dao Building", "k": "Administration", "d": "The main administration building. Facing the central driveway, a wide stone staircase leads up to a two-story opening in the red brick wall. Four large white columns stand inside the entrance hall, so you only see them once you walk in. A white triangular pediment sits on the roof. The north side keeps an old grey stone base with arched windows, and inside are two courtyards divided by a red brick arcade.", "f": "After more than 70 years the two original red buildings were worn out, so in 1991 they were rebuilt into today's four-story, courtyard-style red tile building, keeping the look of the Red House."}, "waxapple": {"n": "Wax Apple Courtyard", "k": "Hong Dao", "d": "The left courtyard of Hong Dao Building. A wax apple tree four stories tall grows in the middle, its crown higher than the corridors. In fruiting season you can look up and see red wax apples.", "f": ""}, "yard2": {"n": "B1 Plaza", "k": "Hong Dao", "d": "A green plaza one level below the ground floor. Look up and you will see the red brick arcade on top of a brick retaining wall, with planters at its foot and stairs at both ends. The big tree behind the arcade is the wax apple tree. Wooden benches sit on the plaza, and two round balcony towers stand side by side on the back building.", "f": ""}, "arcade": {"n": "Red Brick Arcade", "k": "Hong Dao", "d": "A ground-floor red brick arcade linking the north and south wings, with round arches on both sides and potted plants on the roof. Go through the arches on the left to reach the wax apple courtyard; on the right, one level down, is the B1 plaza, with stairs at both ends. The Red House passage is to the south, and going north takes you out to the sports field.", "f": ""}, "oldgate": {"n": "Old Gate", "k": "History", "d": "The southeast corner of the campus is cut at an angle, and the old gate sits on that diagonal, facing the corner of Beimen Road and Gongyuan North Road. It is closed now. The outer pillars have red brick panels; the two inner pillars are cream with red brick stripes. The left plaque reads \"National Tainan Second Senior High School\" and the right one \"Tainan Middle School (Japanese era)\", each pillar topped with a lamp. Behind the gate are an old banyan tree and the old white guard room.", "f": ""}, "railway": {"n": "Old Railway", "k": "Memory", "d": "Looking out from the old gate, across Beimen Road was once the Taiwan Railway main line, and students often heard trains during class. The tracks have since moved underground. Here they are brought back: wait a while and a Tze-Chiang express or a local train may suddenly appear and then fade away.", "f": "Turn on \"Sound\" at the top right to hear the train horn."}, "auditorium": {"n": "Small Auditorium", "k": "City monument", "d": "The former lecture hall of Tainan Middle School, a Japanese-era building that is now the school's small auditorium. Layers of red brick and grey stone alternate; the front has a large triangular gable with three round-arched windows, a porch with four brick columns, and a retro arcade of arched doors and windows. The simple, generous interior is perfect for mid-sized concerts.", "f": "Designated a Tainan City monument in 1997; restoration funded by the central government began in 2010 and was completed in 2014."}, "oldhall": {"n": "Old Classroom Building", "k": "History", "d": "A single-story building by the east wall, southeast of the small auditorium, standing on its own. White walls, a pale green tiled roof with a row of small clerestory windows, a front porch on white columns, and brown shutters. On the lawn in front are a standing stone, a brick arch sculpture and a black boulder.", "f": ""}, "karesansui": {"n": "Dry Garden", "k": "Garden", "d": "A Japanese dry garden in front of the small auditorium. White gravel is raked into parallel lines, with circles raked around three moss-covered rocks. Facing the auditorium, the old classroom building is on your right by the wall.", "f": ""}, "avenue": {"n": "Central Avenue", "k": "Path", "d": "The avenue running north from the Red House passage, out through Hong Dao Building to the sports field. On your left is the brick service corner of the north wing, with green bins and carts at the door; far ahead is the colonnade of Ming-De Hall.", "f": ""}, "arts": {"n": "Arts Building", "k": "Classrooms", "d": "The arts building on the east side of the sports field. Each floor of the red brick wall has a white band, and the windows are divided by white frames. The ground floor is an arcade with columns, two brick stair towers rise from the roof, and a round glass stairwell stands at the south end.", "f": "On sports day, classes line up on the field to march in, with this building as the backdrop."}, "field": {"n": "Sports Field", "k": "Sports", "d": "A north–south running track with a lawn in the middle. Morning assemblies, sports day and PE classes all happen here. Walk to the middle of the lawn and turn around to see the whole campus.", "f": "When the blogger visited in 2016 it was still a red clay track. Bike parking is at the north end, and the basketball courts are right next to the west side."}, "banyan": {"n": "Under the Banyans", "k": "School life", "d": "A row of big banyan trees on the south side of the field. On sports day each class sets up camp here, and during big exams tents are put up for waiting parents.", "f": ""}, "mingde": {"n": "Ming-De Hall", "k": "Gym", "d": "A large gym in yellow-brown tile. It faces east across the field toward the small auditorium: a long colonnade with \"明德堂 Ming-De Hall\" above it, and the school store right behind the columns. A big mosaic relief covers the south side of the southeast tower, and stairs lead up on the tower's west side.", "f": "Ming-De Hall is the gym, and the school co-op store is here too. Opening ceremonies, parent meetings and large assemblies are held here, with a stage on the first floor and stands on the second."}, "relief": {"n": "Ming-De Hall Relief", "k": "Art", "d": "The south wall of Ming-De Hall's southeast tower carries a large mosaic relief: a swirling blue sky with a black bird at the top, a big tree in the middle, a red-roofed white house at upper right, several figures around it, and rolling waves at the bottom.", "f": ""}, "courts": {"n": "Basketball Courts", "k": "Sports", "d": "Four green basketball courts with pink surrounds and blue hoops. To the east, past a row of trees, are the stage and the sports field; floodlights stand to the south.", "f": ""}, "stage": {"n": "Stage", "k": "Sports", "d": "The stage on the west side of the field, with a red brick base, white columns and a steel truss roof. It faces the field and the Arts Building to the east. The principal and directors stand here during morning assemblies and sports day.", "f": ""}, "tennis": {"n": "Tennis & Volleyball Courts", "k": "Sports", "d": "Clay tennis courts to the north, surrounded by a high wire fence, and concrete volleyball courts to the south. A red brick path lined with trees runs along the wall north of the tennis courts.", "f": ""}, "covered": {"n": "Covered Court", "k": "Sports", "d": "A court with a roof. PE classes move here on rainy days, and it is the coolest spot on a summer afternoon.", "f": ""}, "pool": {"n": "Swimming Pool", "k": "Sports", "d": "A swimming pool with a blue roof, north of the back Ren-Ai Building; further north is the curved roof of the covered court. Whale shark murals cover the pool wall, and a long shed with a blue corrugated roof stands to the south.", "f": ""}, "pe": {"n": "PE Office", "k": "Sports", "d": "A three-story grey-white building southeast of the pool, with window grilles, a railing and steel water tanks on the roof, and a blue corrugated shelter on the west side.", "f": ""}, "renai": {"n": "Ren-Ai Building", "k": "Classrooms", "d": "Classrooms for 10th and 11th graders. White floor slabs with brick-red tiles, open corridors with railings on every floor, and blue glass sunshades along the roof edge. The north face of the front building is a grid of concrete balcony frames with air conditioners on the windows; between the two buildings is a brick courtyard with big trees.", "f": "The blog describes it as \"classrooms for first- and second-year students\"."}, "yard3": {"n": "Ren-Ai Courtyard", "k": "Ren-Ai", "d": "The courtyard between the two Ren-Ai buildings. A ring of hedges circles under the big tree, and a green metal ring sculpture stands in the middle.", "f": ""}, "ziqing": {"n": "Ziqing Pavilion", "k": "Pavilion", "d": "An octagonal pavilion in front of the front Ren-Ai Building, right outside the English and Social Studies offices. Green glazed tiles, red columns, three round steps, and a red brick plaza all around. Students often sit here between classes to chat or review vocabulary.", "f": ""}, "bridge": {"n": "Ren-Ai Bridge", "k": "Ren-Ai", "d": "A concrete frame extending south from the back Ren-Ai Building, with open corridors on each floor and a blue skylight on top. At the south end is a white stair tower with three round windows in a column and a pink-railed balcony; beyond it is the front building.", "f": ""}, "pinkwing": {"n": "English & Social Studies Offices", "k": "Ren-Ai", "d": "A small pink-tiled building next to the front Ren-Ai Building, larger at the bottom and smaller on top: the English office is on the ground floor and the Social Studies office on the set-back second floor, with a steel pergola on the roof terrace. The door has a canopy and a few steps, facing Ziqing Pavilion and the brick plaza.", "f": ""}, "deadtree": {"n": "Old Tree Trunk", "k": "Ren-Ai", "d": "An old tree trunk on the brick plaza in front of the front Ren-Ai Building, standing in an oval stone planter, with a hollow in its trunk.", "f": ""}, "kgym": {"n": "K Hall", "k": "Sports", "d": "A separate four-story red brick building west of the library, some distance away from Ziqing Pavilion, the English and Social Studies offices and the front Ren-Ai Building. The first two floors fill the whole footprint and the third and fourth floors are set back. On the left is a deep overhanging porch with glass doors and wide steps, the third-floor terrace has a green skylight canopy, and a big tree stands on the north side.", "f": ""}, "library": {"n": "Library", "k": "Study", "d": "A white four-story building. The second and third floors are wrapped in wooden horizontal louvers, \"Library\" is written on the ground floor, and 圖書館 is on the top floor. The entrance faces the brick plaza, and corridors on the first, second and third floors connect its north side to Qin Xue Building.", "f": ""}, "qinxue": {"n": "Qin Xue Building", "k": "Classrooms", "d": "A three-story pink-tiled building with a row of round-arched windows on the top floor and a columned arcade on the ground floor. The library is to the south of its west end, linked by corridors on three floors; a white round building stands at the east end, and a large brick plaza lies in front.", "f": ""}, "food": {"n": "Food Court", "k": "School life", "d": "The east end of the Qin Xue arcade, with lunch box, noodle and drink shops and tables under the arcade. The moment the lunch bell rings, this is where the first line forms.", "f": "The blog describes the food court as outside restaurants and drink shops."}, "science": {"n": "Science Building", "k": "Classrooms", "d": "The pink building just left of the main gate. The east side facing the driveway has triangular window hoods, a third-floor pergola terrace and an arched entrance; the north side facing the brick plaza has vertical piers, a crenellated parapet, two white columns at the entrance and a \"Science Building\" sign. The white dome on the roof is the planetarium.", "f": "Physics, chemistry, biology and earth science labs are all here, and the fourth floor has an AI experience classroom."}, "science2": {"n": "Science Building North Entrance", "k": "Classrooms", "d": "The Science Building seen from the brick plaza in front of Qin Xue Building: vertical piers, round-arched windows on the top floor, two white columns under the entrance canopy, and 科學館 written down the wall. The library is on your right.", "f": ""}, "heron": {"n": "Malayan Night Heron", "k": "Campus resident", "d": "A bird often seen on campus. It is not afraid of people and walks slowly across the lawn, looking for earthworms. Stop, and it will stop and look at you too.", "f": "The blogger also me   let ix=0, iz=0;
  if(keys.KeyW||keys.ArrowUp) iz+=1;
  if(keys.KeyS||keys.ArrowDown) iz-=1;
  if(keys.KeyA||keys.ArrowLeft) ix-=1;
  if(keys.KeyD||keys.ArrowRight) ix+=1;
  if(joyId!==null){ ix+=joyV.x; iz+=-joyV.y; }
  const mag = Math.min(1, Math.hypot(ix,iz));
  let moving = false;

  if(fly){
    fly.t = Math.min(1, fly.t + dt/1.2);
    const e = fly.t<0.5 ? 2*fly.t*fly.t : 1-Math.pow(-2*fly.t+2,2)/2;
    player.position.lerpVectors(fly.from, fly.to, e);
    yaw = fly.yaw0 + (fly.yaw1-fly.yaw0)*e;
    player.rotation.y = fly.face; moving = true;
    if(fly.t>=1 || mag>0.1) fly = null;
  } else if(mag>0.05){
    const speed = (keys.ShiftLeft||keys.ShiftRight) ? 30 : 15;
    const fx=-Math.sin(yaw), fz=-Math.cos(yaw), rx=-fz, rz=fx;
    let mx=fx*iz+rx*ix, mz=fz*iz+rz*ix;
    const ml=Math.hypot(mx,mz)||1; mx/=ml; mz/=ml;
    const ox=player.position.x, oz=player.position.z;
    player.position.x += mx*speed*mag*dt;
    player.position.z += mz*speed*mag*dt;
    pushOut(player.position);
    if(!inside(player.position.x,player.position.z)){
      if(inside(player.position.x,oz)) player.position.z=oz;
      else if(inside(ox,player.position.z)) player.position.x=ox;
      else { player.position.x=ox; player.position.z=oz; }
    }
    let d = Math.atan2(mx,mz) - player.rotation.y; d = Math.atan2(Math.sin(d),Math.cos(d));
    player.rotation.y += d*Math.min(1,dt*12);
    moving = true;
  }
  if(moving) walkT += dt*10; else walkT *= 0.85;
  const sw = Math.sin(walkT)*(moving?0.6:0);
  player.userData.legs[0].rotation.x = sw; player.userData.legs[1].rotation.x = -sw;
  const gY = groundY(player.position.x, player.position.z);
  player.position.y = gY + (moving ? Math.abs(Math.sin(walkT))*0.15 : 0);

  // heron
  const hd = heron.userData;
  if(heron.position.distanceTo(player.position) < 6){
    const a = Math.atan2(player.position.x-heron.position.x, player.position.z-heron.position.z);
    let d=a-heron.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); heron.rotation.y += d*dt*3;
    hd.head.position.y = 3;
  } else if(hd.wait>0){
    hd.wait -= dt; hd.head.position.y = 3 - Math.max(0,Math.sin(t*3))*0.6;
  } else {
    const v = hd.target.clone().sub(heron.position); v.y=0;
    if(v.length()<0.4){ hd.wait=2+Math.random()*4; hd.target.set(hd.home.x+(Math.random()-0.5)*30, 0, hd.home.z+(Math.random()-0.5)*8); }
    else { v.normalize(); heron.position.addScaledVector(v, dt*1.6);
      const a=Math.atan2(v.x,v.z); let d=a-heron.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); heron.rotation.y+=d*dt*4;
      heron.position.y = Math.abs(Math.sin(t*6))*0.08; hd.head.position.y = 3; }
  }
  updateStudents(dt, t);
  updateTrains(dt);
  updateMaids(dt);
  if(ledState && (ledFrame++ % 3 === 0)) ledState.draw(t);
  if(heronLabel) heronLabel.position.set(heron.position.x,5.6,heron.position.z);
  trailT+=dt; if(trailT>0.12){ trailT=0; heronTrail.push(heron.position.clone()); if(heronTrail.length>60) heronTrail.shift(); }
  chicks.forEach((c,i)=>{ const idx=heronTrail.length-1-(i+1)*9; if(idx<0) return; const tp=heronTrail[idx];
    const dx=tp.x-c.position.x, dz=tp.z-c.position.z, d=Math.hypot(dx,dz);
    if(d>0.05){ c.position.x+=dx*Math.min(1,dt*3); c.position.z+=dz*Math.min(1,dt*3); c.rotation.y=Math.atan2(dx,dz); c.position.y=Math.abs(Math.sin(t*9+i))*0.06; }
    c.children[0].rotation.x=0; });
  if(window.__sunSculpt) window.__sunSculpt.rotation.y = t*0.3;

  let best=null, bd=1e9;
  PLACES.forEach(p=>{
    const px = p.dynamic ? heron.position.x : p.sx, pz = p.dynamic ? heron.position.z : p.sz;
    const d = Math.hypot(player.position.x-px, player.position.z-pz);
    if(d < p.r && d/p.r < bd){ bd=d/p.r; best=p; }
  });
  if(!fly) showPlace(best);

  camTarget.set(player.position.x, gY+3, player.position.z);
  const cp = Math.cos(pitch);
  const inYard = YARDS.some(r=>player.position.x>r.x-r.w/2 && player.position.x<r.x+r.w/2 && player.position.z>r.z-r.d/2 && player.position.z<r.z+r.d/2);
  const ePitch = gY < -1 ? Math.max(pitch,0.25) : inYard ? Math.max(pitch,0.5) : pitch, eDist = inYard ? Math.min(dist,15) : dist;
  const c2 = Math.cos(ePitch);
  camDir.set(Math.sin(yaw)*c2, Math.sin(ePitch), Math.cos(yaw)*c2).normalize();
  ray.set(camTarget, camDir); ray.far = eDist;
  const hits = ray.intersectObjects(occluders, false);
  const cd = hits.length ? Math.max(2.5, hits[0].distance-0.8) : eDist;
  camSmooth.lerp(camDir.clone().multiplyScalar(cd), Math.min(1, dt*8));
  camera.position.copy(camTarget).add(camSmooth);
  camera.lookAt(camTarget);
  sun.position.set(player.position.x-150, 120, player.position.z+90);
  skyDome.position.copy(camera.position); stars.position.copy(camera.position);
  if((timeTick+=dt)>1){ timeTick=0; applyTime(curHour()); }
  if(window.__sunOff){ const o=window.__sunOff; sun.position.set(player.position.x+o[0], o[1], player.position.z+o[2]); moon.position.set(camera.position.x-o[0]*3.5, Math.max(120,400-o[1]), camera.position.z-260); }
  sun.target.position.set(player.position.x,0,player.position.z); sun.target.updateMatrixWorld();
  for(const l of labels){ const d=camera.position.distanceTo(l.position); l.visible = labelsOn && d>30; l.material.opacity = Math.min(1,(d-30)/16); }
  renderer.render(scene, camera);
  drawMini();
  requestAnimationFrame(step);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

Promise.race([
  (document.fonts && document.fonts.load ? Promise.all([document.fonts.load('900 44px "Noto Serif TC"','南二中大門止於至善國立臺南第二高級中學'), document.fonts.load('700 16px "Noto Sans TC"','N')]) : Promise.resolve()),
  new Promise(r=>setTimeout(r,2500))
]).catch(()=>{}).then(buildLabels);
(function(){ const done=new Set();
  scene.traverse(o=>{ if(o.userData && o.userData.keepColor) return; const ms=o.material ? (Array.isArray(o.material)?o.material:[o.material]) : [];
    ms.forEach(m=>{ if(!m || done.has(m)) return; done.add(m);
      if(m.color && !m.isShaderMaterial) m.color.convertSRGBToLinear();
      if(m.emissive) m.emissive.convertSRGBToLinear();
      if(m.map){ m.map.encoding=T.sRGBEncoding; m.map.needsUpdate=true; }
      m.needsUpdate=true; }); });
})();
scene.traverse(o=>{ const ms=o.material?(Array.isArray(o.material)?o.material:[o.material]):[]; ms.forEach(m=>{ if(m&&m.emissive&&m.emissiveIntensity>0&&m.emissive.getHex()!==0&&!glowMats.some(g=>g.m===m)) glowMats.push({m,base:m.emissiveIntensity}); }); });
applyLang();
$('loading').hidden = true;
requestAnimationFrame(step);
})();
</script>
